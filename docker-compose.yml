services:
  mcp-lab:
    build: .
    image: mcp-lab:latest
    container_name: mcp-lab
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      MCPLAB_LLM_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspace
